name: CI

on:
  pull_request:
  push:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Tests use a real Redis (BullMQ, rate limits, WS fan-out) — ADR 0005.
    services:
      redis:
        image: redis:7.4-alpine
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      REDIS_URL: redis://127.0.0.1:6380
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      # mongodb-memory-server downloads the MongoDB binary on first test run (version pinned in package.json).
      - name: Cache MongoDB binaries
        uses: actions/cache@v6
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-${{ runner.os }}-8.2.12

      - name: Lint
        run: npm run lint

      - name: Format
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Test (with coverage gate)
        run: npm run test:coverage

      - name: Build
        run: npm run build

      - name: OpenAPI spec is up to date
        run: npm run openapi:check

  secrets-scan:
    name: secrets-scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write # PR comments on findings
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Personal-account repo: no GITLEAKS_LICENSE needed.
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  audit:
    name: audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    continue-on-error: true # informational until dependencies stabilise
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm audit --audit-level=high

  commitlint:
    name: commitlint
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Lint commit messages
        run: npx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose

  # Phase 13: the staging image builds (no push) and contains no secrets / tests.
  image:
    name: image
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Lint the Dockerfile
        run: docker run --rm -i hadolint/hadolint:v2.12.0 < Dockerfile

      - name: Build
        run: docker build --build-arg "GIT_SHA=${GITHUB_SHA}" --build-arg "BUILT_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" -t cav-backend:ci .

      - name: Check the image
        run: deploy/staging/scripts/check-image.sh cav-backend:ci

  # Phase 13: staging compose, nginx and shell scripts.
  infra-lint:
    name: infra-lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Compose file
        run: |
          mkdir -p "$RUNNER_TEMP/cav/env" && touch "$RUNNER_TEMP/cav/env/backend.env"
          CAV_ROOT="$RUNNER_TEMP/cav" APP_SHA=ci MONGO_PASSWORD=x REDIS_PASSWORD=x \
            docker compose -f deploy/staging/compose.yaml config -q

      - name: nginx -t
        run: deploy/staging/scripts/check-nginx.sh

      - name: shellcheck
        run: docker run --rm -v "$PWD/deploy:/mnt" koalaman/shellcheck-alpine:v0.10.0 sh -c 'shellcheck /mnt/staging/scripts/*.sh'
