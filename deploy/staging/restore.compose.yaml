name: cell-ai-voicebot-restore-check
services:
  mongo:
    image: mongo:8.2@sha256:e0ce8c35124d4a9f9785532d1f268f39e9728ffa1cb38f46fa482436424c4bd3
    ports: ['127.0.0.1:27118:27017']
    tmpfs: [/data/db]
    healthcheck:
      test: [CMD, mongosh, --quiet, --eval, 'db.adminCommand({ping:1}).ok']
      interval: 2s
      timeout: 5s
      retries: 30
  redis:
    image: redis:7.4-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    ports: ['127.0.0.1:6480:6379']
