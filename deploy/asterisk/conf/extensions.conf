; Dialplan (ADR 0050). Outbound calls are started by ARI and go straight to the app "cav";
; cav-amd is used instead when the campaign asks for answering machine detection.
[general]
static=yes
writeprotect=yes

[cav-in]
; Calls from the trunk: refused until inbound calling (Phase 19).
exten => _X.,1,Hangup(21)
exten => _+X.,1,Hangup(21)
exten => s,1,Hangup(21)

[cav-amd]
exten => s,1,AMD(2500,1500,800,5000,100,50,3,256)
 same => n,Stasis(${CAV_APP},amd,${AMDSTATUS},${AMDCAUSE})
 same => n,Hangup()
