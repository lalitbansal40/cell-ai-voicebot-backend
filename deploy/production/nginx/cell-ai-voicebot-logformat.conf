# Phase 13: access log without query strings (WebSocket tickets, Embedded Signup codes,
# signed file links never reach the log). Installed in /etc/nginx/conf.d/.
log_format cav_noargs '$remote_addr - [$time_local] "$request_method $uri $server_protocol" '
                      '$status $body_bytes_sent $request_time "$http_user_agent"';
