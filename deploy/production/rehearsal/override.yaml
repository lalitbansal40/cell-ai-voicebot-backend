# Rehearsal on a laptop only (Docker Desktop has no host networking). All services share the mongo
# container's network, so 127.0.0.1:27018 and :6379 work as on the server, and nginx serves the
# SPA over plain HTTP on :8080. Dummy provider keys; no provider is ever called.
services:
  mongo:
    ports: !override
      - '127.0.0.1:27118:27018'
      - '127.0.0.1:5100:5100'
      - '127.0.0.1:18080:8080'
    volumes: !override
      - cav-rehearsal-mongo:/data/db
      - ${CAV_ROOT}/env/mongo-keyfile:/run/mongo-keyfile:ro
  redis:
    network_mode: service:mongo
    ports: !reset []
    volumes: !override
      - cav-rehearsal-redis:/data
  api:
    network_mode: service:mongo
    environment:
      HOST: 0.0.0.0
      WA_MEDIA_ENABLED: 'false'
  worker:
    network_mode: service:mongo
  nginx:
    image: nginx:1.27-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
    container_name: cav-prod-rehearsal-nginx
    network_mode: service:mongo
    volumes:
      - ${CAV_ROOT}/deploy/rehearsal/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ${CAV_ROOT}/releases:/srv/releases:ro
volumes:
  cav-rehearsal-mongo:
  cav-rehearsal-redis:
