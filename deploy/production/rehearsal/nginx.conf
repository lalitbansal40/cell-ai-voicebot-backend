server {
  listen 8080;
  root /srv/releases/current/web;
  location = /robots.txt { default_type text/plain; return 200 "User-agent: *\nDisallow: /\n"; }
  location = /ready { return 404; }
  location = /api/v1/ready { return 404; }
  location = /health { proxy_pass http://127.0.0.1:5100; }
  location /api/ { proxy_pass http://127.0.0.1:5100; proxy_set_header X-Forwarded-For $remote_addr; }
  location /ws/ {
    proxy_pass http://127.0.0.1:5100;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }
  location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable" always; }
  location / {
    add_header Cache-Control "no-cache" always;
    try_files $uri /index.html;
  }
}
