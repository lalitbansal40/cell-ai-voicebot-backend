# Local development infrastructure — MongoDB (single-node replica set) + Redis.
# Ports are bound to 127.0.0.1 only and differ from defaults (see ADR 0028).
name: cell-ai-voicebot

services:
  mongo:
    image: mongo:8.2
    container_name: cav-mongo
    command: ['mongod', '--replSet', 'rs0', '--port', '27018', '--bind_ip_all']
    ports:
      - '127.0.0.1:27018:27018'
    volumes:
      - cav-mongo-data:/data/db
    restart: unless-stopped
    healthcheck:
      # Also initiates the replica set on first start (idempotent).
      test:
        - CMD-SHELL
        - >-
          mongosh --port 27018 --quiet --eval "try { rs.status().ok } catch (e) {
          rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: '127.0.0.1:27018' }] }).ok }"
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 10s

  redis:
    image: redis:7.4-alpine
    container_name: cav-redis
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '127.0.0.1:6380:6379'
    volumes:
      - cav-redis-data:/data
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  cav-mongo-data:
  cav-redis-data:
