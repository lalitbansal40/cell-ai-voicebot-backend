<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Voice AI PoC — browser test</title>
    <style>
      body {
        font-family:
          -apple-system,
          Segoe UI,
          Roboto,
          sans-serif;
        max-width: 860px;
        margin: 24px auto;
        padding: 0 16px;
        color: #1f2430;
      }
      fieldset {
        border: 1px solid #d5dce6;
        border-radius: 8px;
        margin-bottom: 12px;
      }
      label {
        display: inline-block;
        margin: 4px 12px 4px 0;
      }
      button {
        padding: 8px 16px;
        border-radius: 6px;
        border: 0;
        background: #1d5fa3;
        color: #fff;
        cursor: pointer;
      }
      button:disabled {
        background: #9db3cc;
      }
      #stats {
        margin: 12px 0;
        font-variant-numeric: tabular-nums;
      }
      #log {
        border: 1px solid #d5dce6;
        border-radius: 8px;
        padding: 12px;
        height: 420px;
        overflow-y: auto;
        background: #f8fafc;
      }
      .customer {
        color: #0b6b3a;
      }
      .bot {
        color: #1d5fa3;
      }
      .tool {
        color: #8a5a00;
      }
      .error {
        color: #b42318;
      }
      .row {
        margin: 6px 0;
      }
    </style>
  </head>
  <body>
    <h2>Voice AI PoC — browser test</h2>
    <p>
      Use headphones (prevents the bot hearing itself). Speak Hindi, English or Hinglish; interrupt
      the bot to test barge-in.
    </p>
    <fieldset>
      <legend>Call settings</legend>
      <label
        >Mode
        <select id="mode">
          <option value="pcm24k">PCM 24 kHz</option>
          <option value="g711_ulaw">G.711 μ-law (phone)</option>
        </select></label
      >
      <label
        >Model
        <select id="model">
          <option>gpt-realtime-2.1-mini</option>
          <option>gpt-realtime-2.1</option>
        </select></label
      >
      <label
        >Voice
        <select id="voice">
          <option>marin</option>
          <option>cedar</option>
          <option>coral</option>
          <option>sage</option>
        </select></label
      >
      <label
        >Mock payment
        <select id="payment">
          <option value="not_paid">not paid</option>
          <option value="paid">paid</option>
          <option value="partial">partial</option>
        </select></label
      >
      <br />
      <label>Name <input id="name" value="Lalit Bansal" /></label>
      <label>Amount ₹ <input id="amount" value="5,500" size="8" /></label>
      <label>Days <input id="days" value="120" size="4" /></label>
    </fieldset>
    <button id="start">Start call</button>
    <button id="stop" disabled>End call</button>
    <div id="stats">
      Latency (last): <b id="lat">–</b> ms · avg <b id="avg">–</b> ms · Cost: $<b id="cost">0</b>
    </div>
    <div id="log"></div>
    <script src="/app.js"></script>
  </body>
</html>
