; LAB ONLY — local SIP lab (T0.16).
[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060

; SIPp test caller (static IP in the lab network, no auth).
[sipp]
type=endpoint
context=lab
disallow=all
allow=ulaw
; SIPp sends DTMF as SIP INFO. A real trunk uses RFC 4733 (dtmf_mode=rfc4733) — Phase 13.
dtmf_mode=info
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes

[sipp]
type=identify
endpoint=sipp
match=172.29.0.30

; Optional manual test with a softphone (Zoiper / Linphone) — password from .env.lab.
#include pjsip_softphone.conf
